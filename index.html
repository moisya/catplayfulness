<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 猫の遊び指標解析システム</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/h5wasm@0.6.1/dist/h5wasm.js"></script>
</head>
<body>
    <!-- アップロード画面 -->
    <div id="uploadScreen" class="screen">
        <div class="upload-container">
            <h1>🐱 猫の遊び指標解析システム</h1>
            <p>H5ファイルと動画をアップロードして、猫の遊び指標を自動解析します</p>
            
            <!-- H5ファイルアップロード -->
            <div class="upload-section">
                <h3>📊 H5ファイル（必須）</h3>
                <div class="upload-area" id="h5UploadArea">
                    <div class="upload-icon">📁</div>
                    <p>H5ファイルをドラッグ&ドロップ<br>またはクリックして選択</p>
                    <input type="file" id="h5Input" accept=".h5" hidden>
                </div>
                <div class="file-info" id="h5FileInfo"></div>
            </div>
            
            <!-- 動画ファイルアップロード -->
            <div class="upload-section">
                <h3>🎥 動画ファイル（推奨）</h3>
                <div class="upload-area" id="videoUploadArea">
                    <div class="upload-icon">🎬</div>
                    <p>動画ファイルをドラッグ&ドロップ<br>またはクリックして選択</p>
                    <input type="file" id="videoInput" accept="video/*" hidden>
                </div>
                <div class="file-info" id="videoFileInfo"></div>
            </div>
            
            <!-- 解析設定 -->
            <div class="settings-section">
                <h3>⚙️ 解析設定</h3>
                <div class="setting-row">
                    <label>FPS:</label>
                    <input type="number" id="fpsInput" value="30" min="1" max="120">
                </div>
                <div class="setting-row">
                    <label>ウィンドウサイズ（秒）:</label>
                    <input type="number" id="windowInput" value="2.0" min="0.5" max="10" step="0.5">
                </div>
                <div class="setting-row">
                    <label>信頼度しきい値:</label>
                    <input type="number" id="confidenceInput" value="0.5" min="0" max="1" step="0.1">
                </div>
            </div>
            
            <!-- 解析開始ボタン -->
            <button id="analyzeBtn" class="analyze-btn" disabled>
                🚀 解析開始
            </button>
        </div>
    </div>
    
    <!-- 解析中画面 -->
    <div id="analysisScreen" class="screen hidden">
        <div class="analysis-container">
            <h2>🔍 解析中...</h2>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">準備中...</div>
            </div>
            <div class="analysis-steps">
                <div class="step" id="step1">📁 ファイル読み込み</div>
                <div class="step" id="step2">🔍 データ解析</div>
                <div class="step" id="step3">📊 指標計算</div>
                <div class="step" id="step4">🎨 可視化生成</div>
            </div>
        </div>
    </div>
    
    <!-- 結果表示画面 -->
    <div id="resultsScreen" class="screen hidden">
        <div class="results-container">
            <div class="results-header">
                <h1>📊 解析結果</h1>
                <button id="newAnalysisBtn" class="new-analysis-btn">新しい解析</button>
            </div>
            
            <div class="metadata-panel">
                <h3>解析情報</h3>
                <div id="analysisMetadata"></div>
            </div>
            
            <div class="main-content">
                <div class="video-section">
                    <h3>🎥 動画</h3>
                    <video id="resultVideo" controls preload="metadata"></video>
                    <div class="time-info">
                        現在時刻: <span id="currentTime">0.0</span>秒
                    </div>
                </div>
                
                <div class="chart-section">
                    <h3>📈 Playfulness指標</h3>
                    <div class="chart-container">
                        <canvas id="playChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button onclick="playPause()">⏯️ 再生/停止</button>
                <button onclick="seekToTime(10)">⏭️ 10秒</button>
                <button onclick="seekToTime(30)">⏭️ 30秒</button>
                <button onclick="exportResults()">💾 結果をダウンロード</button>
            </div>
        </div>
    </div>

    <script src="js/upload.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
